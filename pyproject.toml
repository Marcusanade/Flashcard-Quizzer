[tool.black]
line-length = 88
extend-exclude = '''
/(
    venv
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
skip = ["venv", "htmlcov", ".claude"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "*/__init__.py",
    "venv/*",
    "htmlcov/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
